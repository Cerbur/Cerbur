<svg width="980" height="720" viewBox="0 0 980 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CERBUR.pkg achievement wall</title>
  <desc id="desc">A 3 by 3 Liquid Glass style achievement wall for Cerbur's stack, favorite tools and background.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="980" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.48" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#ECF5F8"/>
    </linearGradient>
    <radialGradient id="aqua" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 132) rotate(39) scale(360 210)">
      <stop offset="0" stop-color="#C8F6FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C8F6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(802 126) rotate(136) scale(340 220)">
      <stop offset="0" stop-color="#FFE0F2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE0F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 612) rotate(154) scale(360 190)">
      <stop offset="0" stop-color="#FFF0B8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFF0B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#DCEBFF" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#52677A" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.82"/>
    </filter>
    <filter id="tinyNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="clipCard"><rect width="274" height="142" rx="26"/></clipPath>
    <style>
      .kicker { font: 800 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #6E7F91; }
      .title { font: 850 44px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; letter-spacing: 0; fill: #132033; }
      .subtitle { font: 650 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #708397; }
      .pkg { font: 850 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; letter-spacing: 0; fill: #1D3348; }
      .tag { font: 850 11px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #7C8DA0; }
      .name { font: 850 24px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; letter-spacing: 0; fill: #142236; }
      .detail { font: 650 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #627487; }
      .icon { font: 850 26px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #1B334D; }
      .cardStroke { stroke: rgba(255,255,255,0.88); stroke-width: 1.2; }
      .hairline { stroke: rgba(80,104,130,0.18); stroke-width: 1; }
    </style>
  </defs>

  <rect width="980" height="720" rx="34" fill="url(#paper)"/>
  <rect width="980" height="720" rx="34" fill="url(#aqua)"/>
  <rect width="980" height="720" rx="34" fill="url(#rose)"/>
  <rect width="980" height="720" rx="34" fill="url(#sun)"/>
  <rect width="980" height="720" rx="34" filter="url(#tinyNoise)" opacity="0.9"/>

  <path d="M64 104C168 42 276 72 362 130C466 201 564 116 666 70C769 24 874 54 922 116" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.72"/>
  <path d="M48 604C188 666 285 624 397 578C514 530 626 650 784 594C842 574 887 538 928 506" stroke="#D0E8F0" stroke-width="2" stroke-opacity="0.62"/>

  <g transform="translate(54 45)">
    <text x="0" y="0" dominant-baseline="hanging" class="kicker">LIQUID GLASS MERIT BOARD</text>
    <text x="0" y="25" dominant-baseline="hanging" class="title">Achievements</text>
    <text x="2" y="83" dominant-baseline="hanging" class="subtitle">stack, taste and background in a tiny macOS-ish package</text>
  </g>

  <g transform="translate(776 52)" filter="url(#softShadow)">
    <rect width="150" height="42" rx="21" fill="url(#glass)" class="cardStroke"/>
    <rect x="1" y="1" width="148" height="20" rx="20" fill="url(#shine)" opacity="0.72"/>
    <circle cx="25" cy="21" r="8" fill="#5AC8FA" opacity="0.85"/>
    <text x="43" y="26" class="pkg">CERBUR.pkg</text>
  </g>

  <!-- Row 1: Tech stack -->
  <g transform="translate(54 154)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#F05A3C" fill-opacity="0.16" stroke="#F05A3C" stroke-opacity="0.28"/>
    <text x="39" y="58" class="icon">J</text>
    <text x="88" y="39" class="tag">STACK</text>
    <text x="88" y="71" class="name">Java</text>
    <text x="88" y="101" class="detail">primary backend language</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <g transform="translate(353 154)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#00ADD8" fill-opacity="0.16" stroke="#00ADD8" stroke-opacity="0.30"/>
    <text x="34" y="58" class="icon">Go</text>
    <text x="88" y="39" class="tag">STACK</text>
    <text x="88" y="71" class="name">Golang</text>
    <text x="88" y="101" class="detail">service & infra friendly</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <g transform="translate(652 154)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#6DB33F" fill-opacity="0.16" stroke="#6DB33F" stroke-opacity="0.30"/>
    <text x="38" y="58" class="icon">S</text>
    <text x="88" y="39" class="tag">STACK</text>
    <text x="88" y="71" class="name">Spring</text>
    <text x="88" y="101" class="detail">Boot / Cloud / MyBatis</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <!-- Row 2: Favorite tech -->
  <g transform="translate(54 320)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#1D1D1F" fill-opacity="0.08" stroke="#1D1D1F" stroke-opacity="0.20"/>
    <text x="36" y="58" class="icon">⌘</text>
    <text x="88" y="39" class="tag">LIKES</text>
    <text x="88" y="71" class="name">macOS</text>
    <text x="88" y="101" class="detail">native feel, clean workflow</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <g transform="translate(353 320)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#10A37F" fill-opacity="0.16" stroke="#10A37F" stroke-opacity="0.28"/>
    <text x="35" y="58" class="icon">AI</text>
    <text x="88" y="39" class="tag">LIKES</text>
    <text x="88" y="71" class="name">Codex</text>
    <text x="88" y="101" class="detail">coding agents as leverage</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <g transform="translate(652 320)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#5B6CFF" fill-opacity="0.14" stroke="#5B6CFF" stroke-opacity="0.28"/>
    <text x="35" y="58" class="icon">DS</text>
    <text x="88" y="39" class="tag">LIKES</text>
    <text x="88" y="71" class="name">DeepSeek</text>
    <text x="88" y="101" class="detail">reasoning with sharp edges</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <!-- Row 3: About -->
  <g transform="translate(54 486)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#FF69B4" fill-opacity="0.16" stroke="#FF69B4" stroke-opacity="0.30"/>
    <text x="35" y="58" class="icon">N</text>
    <text x="88" y="39" class="tag">ABOUT</text>
    <text x="88" y="71" class="name">MBTI: ENTP</text>
    <text x="88" y="101" class="detail">curious, elastic, chaotic</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <g transform="translate(353 486)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#FF7A00" fill-opacity="0.15" stroke="#FF7A00" stroke-opacity="0.28"/>
    <text x="34" y="58" class="icon">T</text>
    <text x="88" y="39" class="tag">ABOUT</text>
    <text x="88" y="71" class="name">ex-Temu</text>
    <text x="88" y="101" class="detail">core trading promotion</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <g transform="translate(652 486)" filter="url(#softShadow)">
    <rect width="274" height="142" rx="26" fill="url(#glass)" class="cardStroke"/>
    <g clip-path="url(#clipCard)"><rect x="1" y="1" width="272" height="52" rx="25" fill="url(#shine)" opacity="0.72"/></g>
    <circle cx="48" cy="50" r="25" fill="#EE4D2D" fill-opacity="0.14" stroke="#EE4D2D" stroke-opacity="0.28"/>
    <text x="34" y="58" class="icon">S</text>
    <text x="88" y="39" class="tag">ABOUT</text>
    <text x="88" y="71" class="name">ex-Shopee</text>
    <text x="88" y="101" class="detail">digital fulfillment systems</text>
    <line x1="24" y1="121" x2="250" y2="121" class="hairline"/>
  </g>

  <rect x="18" y="18" width="944" height="684" rx="28" stroke="#FFFFFF" stroke-opacity="0.64"/>
  <rect x="19" y="19" width="942" height="682" rx="27" stroke="#9FB4C8" stroke-opacity="0.13"/>
</svg>
