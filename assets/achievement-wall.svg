<svg width="980" height="430" viewBox="0 0 980 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cerbur achievement wall</title>
  <desc id="desc">A game-like achievement wall for backend systems, reliability and ENTP identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="980" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090A12"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#061923"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1A8"/>
      <stop offset="0.45" stop-color="#F6B73C"/>
      <stop offset="1" stop-color="#B96B16"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FF6FF"/>
      <stop offset="0.5" stop-color="#33AADD"/>
      <stop offset="1" stop-color="#135B8A"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD1F1"/>
      <stop offset="0.52" stop-color="#FF69B4"/>
      <stop offset="1" stop-color="#7C2D6D"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.77 0 0 0 0 1 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .title { font: 800 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: #F8FAFC; }
      .sub { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; fill: #8FA7BF; }
      .rank { font: 800 11px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .name { font: 800 19px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .detail { font: 600 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A7B7C8; }
      .mono { font: 800 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #DDF7FF; }
      .card { fill: rgba(15, 23, 42, 0.84); stroke: rgba(148, 163, 184, 0.26); stroke-width: 1; }
    </style>
  </defs>

  <rect width="980" height="430" rx="28" fill="url(#bg)"/>
  <path d="M58 82C165 13 278 50 358 108C452 176 553 102 640 54C737 1 867 30 935 119" stroke="#33AADD" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="120" cy="86" r="54" fill="#33AADD" opacity="0.13" filter="url(#glow)"/>
  <circle cx="866" cy="108" r="70" fill="#FF69B4" opacity="0.10" filter="url(#glow)"/>

  <text x="42" y="58" class="title">ACHIEVEMENT WALL</text>
  <text x="43" y="83" class="sub">backend systems / trading path / reliability / ENTP mode</text>
  <rect x="793" y="42" width="145" height="36" rx="18" fill="rgba(51,170,221,0.14)" stroke="rgba(51,170,221,0.55)"/>
  <text x="817" y="65" class="mono">CERBUR.EXE</text>

  <g transform="translate(42 116)">
    <rect class="card" width="282" height="116" rx="18"/>
    <circle cx="42" cy="42" r="22" fill="url(#gold)"/>
    <path d="M42 24L47 36L60 37L50 45L53 58L42 51L31 58L34 45L24 37L37 36L42 24Z" fill="#2B1600" opacity="0.82"/>
    <text x="78" y="33" class="rank" fill="#F6B73C">LEGENDARY</text>
    <text x="78" y="59" class="name">Hot Key Slayer</text>
    <text x="78" y="84" class="detail">Binlog active cache</text>
    <text x="78" y="102" class="detail">RT99 under 50ms</text>
  </g>

  <g transform="translate(349 116)">
    <rect class="card" width="282" height="116" rx="18"/>
    <circle cx="42" cy="42" r="22" fill="url(#cyan)"/>
    <path d="M28 42H56M42 28V56M33 33L51 51M51 33L33 51" stroke="#05131F" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="33" class="rank" fill="#67E8F9">EPIC</text>
    <text x="78" y="59" class="name">Sieve Builder</text>
    <text x="78" y="84" class="detail">MQ + HBase + ES</text>
    <text x="78" y="102" class="detail">150k QPS events</text>
  </g>

  <g transform="translate(656 116)">
    <rect class="card" width="282" height="116" rx="18"/>
    <circle cx="42" cy="42" r="22" fill="url(#cyan)"/>
    <path d="M35 59L41 45H31L50 25L44 39H54L35 59Z" fill="#07141D"/>
    <text x="78" y="33" class="rank" fill="#67E8F9">EPIC</text>
    <text x="78" y="59" class="name">Stream Aggregator</text>
    <text x="78" y="84" class="detail">Flink state folding</text>
    <text x="78" y="102" class="detail">-95% recompute</text>
  </g>

  <g transform="translate(42 258)">
    <rect class="card" width="282" height="116" rx="18"/>
    <circle cx="42" cy="42" r="22" fill="#38BDF8" opacity="0.9"/>
    <path d="M27 42H57M33 34H51M33 50H51" stroke="#061923" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="33" class="rank" fill="#7DD3FC">RARE</text>
    <text x="78" y="59" class="name">Promotion Architect</text>
    <text x="78" y="84" class="detail">Coupons / campaigns</text>
    <text x="78" y="102" class="detail">multi-region rollout</text>
  </g>

  <g transform="translate(349 258)">
    <rect class="card" width="282" height="116" rx="18"/>
    <circle cx="42" cy="42" r="22" fill="url(#pink)"/>
    <path d="M31 39C31 31 37 26 44 27C51 28 55 33 55 40C55 49 47 53 42 59C37 53 31 49 31 39Z" fill="#27061E"/>
    <text x="78" y="33" class="rank" fill="#FDA4D8">SPECIAL</text>
    <text x="78" y="59" class="name">ENTP Chaos Architect</text>
    <text x="78" y="84" class="detail">question-first mode</text>
    <text x="78" y="102" class="detail">messy rules to models</text>
  </g>

  <g transform="translate(656 258)">
    <rect class="card" width="282" height="116" rx="18"/>
    <circle cx="42" cy="42" r="22" fill="#38BDF8" opacity="0.9"/>
    <path d="M42 25L56 31V42C56 51 50 57 42 61C34 57 28 51 28 42V31L42 25Z" fill="#061923"/>
    <text x="78" y="33" class="rank" fill="#7DD3FC">RARE</text>
    <text x="78" y="59" class="name">Reliability Mindset</text>
    <text x="78" y="84" class="detail">cache / MQ / fallback</text>
    <text x="78" y="102" class="detail">built for failure</text>
  </g>
</svg>
